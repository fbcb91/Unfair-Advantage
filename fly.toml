# fly.toml app configuration file generated for unfair-advantage on 2026-05-27T11:25:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'unfair-advantage'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
