<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unfair Advantage — Benvenuto in Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #080808; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .icon { font-size: 52px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
    h1 span { color: #d946ef; }
    p { font-size: 14px; color: #6b7280; line-height: 1.6; max-width: 320px; }
    .hint { margin-top: 28px; font-size: 13px; color: #4b5563; }
  </style>
</head>
<body>
  <div>
    <div class="icon">🎉</div>
    <h1>Sei su <span>Premium</span></h1>
    <p>Abbonamento attivato. Torna all'estensione e riapri il popup — le analisi ora sono illimitate.</p>
    <p class="hint">Puoi chiudere questa scheda.</p>
  </div>
</body>
</html>
