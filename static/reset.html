<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unfair Advantage — Nuova password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #080808; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .container { max-width: 400px; width: 100%; }
    .logo { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 32px; }
    .logo span { color: #d946ef; }
    .card { background: #111; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 28px; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    label { display: block; font-size: 11px; font-weight: 500; color: #9ca3af; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    input { display: block; width: 100%; background: #0d0d0d; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #f0f0f0; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 14px; }
    input:focus { border-color: rgba(217,70,239,0.45); }
    .btn { width: 100%; background: #d946ef; color: #fff; font-weight: 600; padding: 11px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-family: inherit; }
    .btn:hover { background: #c026d3; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { font-size: 13px; margin-top: 14px; min-height: 18px; text-align: center; }
    .status.success { color: #22c55e; }
    .status.error { color: #ef4444; }
    .lang-switcher { display: flex; gap: 2px; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 3px; }
    .lang-btn { background: none; border: none; cursor: pointer; padding: 3px 10px; border-radius: 5px; font-size: 12px; font-weight: 600; color: #6b7280; font-family: inherit; transition: all 0.12s; }
    .lang-btn.active { background: rgba(255,255,255,0.1); color: #f0f0f0; }
  </style>
</head>
<body>

  <script>
    const T = {
      it: {
        title: "Unfair Advantage — Nuova password",
        h1: "Scegli una nuova password",
        label_new: "Nuova password",
        placeholder_new: "Minimo 6 caratteri",
        label_confirm: "Conferma password",
        placeholder_confirm: "Ripeti la password",
        btn_update: "Aggiorna password",
        err_invalid_link: "Link non valido o scaduto. Richiedi un nuovo link di reset.",
        err_min6: "Minimo 6 caratteri.",
        err_mismatch: "Le password non coincidono.",
        btn_loading: "Aggiornamento...",
        success_msg: "✓ Password aggiornata! Torna all'estensione e accedi.",
        err_default: "Errore durante l'aggiornamento.",
      },
      en: {
        title: "Unfair Advantage — New password",
        h1: "Choose a new password",
        label_new: "New password",
        placeholder_new: "At least 6 characters",
        label_confirm: "Confirm password",
        placeholder_confirm: "Repeat password",
        btn_update: "Update password",
        err_invalid_link: "Invalid or expired link. Request a new reset link.",
        err_min6: "Minimum 6 characters.",
        err_mismatch: "Passwords don't match.",
        btn_loading: "Updating...",
        success_msg: "✓ Password updated! Go back to the extension and sign in.",
        err_default: "Error updating password.",
      }
    };

    function applyLang(lang) {
      document.documentElement.lang = lang;
      const d = T[lang];

      document.title = d.title;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (d[key] !== undefined) el.textContent = d[key];
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (d[key] !== undefined) el.placeholder = d[key];
      });

      const btnIt = document.getElementById('btnIt');
      const btnEn = document.getElementById('btnEn');
      if (btnIt) btnIt.classList.toggle('active', lang === 'it');
      if (btnEn) btnEn.classList.toggle('active', lang === 'en');
    }

    function setLang(lang) {
      localStorage.setItem('lang', lang);
      applyLang(lang);
    }

    // Init language on load
    (function () {
      const saved = localStorage.getItem('lang');
      const lang = saved || (navigator.language.startsWith('it') ? 'it' : 'en');
      applyLang(lang);
    })();
  </script>

  <div style="position:fixed;top:16px;right:16px;" class="lang-switcher">
    <button class="lang-btn" id="btnIt" onclick="setLang('it')">🇮🇹 IT</button>
    <button class="lang-btn" id="btnEn" onclick="setLang('en')">🇬🇧 EN</button>
  </div>

  <div class="container">
    <div class="logo"><a href="/" style="color:inherit; text-decoration:none;">Unfair <span>Advantage</span></a></div>
    <div class="card">
      <h1 data-i18n="h1">Scegli una nuova password</h1>
      <div id="formWrap">
        <label for="newPassword" data-i18n="label_new">Nuova password</label>
        <input type="password" id="newPassword" placeholder="Minimo 6 caratteri" data-i18n-placeholder="placeholder_new" />
        <label for="confirmPassword" data-i18n="label_confirm">Conferma password</label>
        <input type="password" id="confirmPassword" placeholder="Ripeti la password" data-i18n-placeholder="placeholder_confirm" />
        <button class="btn" id="updateBtn" data-i18n="btn_update">Aggiorna password</button>
      </div>
      <div class="status" id="statusMsg"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://unfair-advantage.fly.dev";

    // Extract access_token from URL hash
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get("access_token");
    const type = params.get("type");

    function getLang() {
      return localStorage.getItem('lang') || (navigator.language.startsWith('it') ? 'it' : 'en');
    }

    if (!accessToken || type !== "recovery") {
      document.getElementById("formWrap").innerHTML = "";
      const s = document.getElementById("statusMsg");
      s.textContent = T[getLang()].err_invalid_link;
      s.className = "status error";
    }

    document.getElementById("updateBtn")?.addEventListener("click", async () => {
      const pw = document.getElementById("newPassword").value;
      const pw2 = document.getElementById("confirmPassword").value;
      const status = document.getElementById("statusMsg");
      const btn = document.getElementById("updateBtn");
      const lang = getLang();

      if (pw.length < 6) { status.textContent = T[lang].err_min6; status.className = "status error"; return; }
      if (pw !== pw2) { status.textContent = T[lang].err_mismatch; status.className = "status error"; return; }

      btn.disabled = true; btn.textContent = T[lang].btn_loading;
      try {
        const res = await fetch(`${SUPABASE_URL}/api/auth/update-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${accessToken}` },
          body: JSON.stringify({ password: pw }),
        });
        if (res.ok) {
          document.getElementById("formWrap").innerHTML = "";
          status.textContent = T[lang].success_msg;
          status.className = "status success";
        } else {
          const d = await res.json().catch(() => ({}));
          throw new Error(d.detail || T[lang].err_default);
        }
      } catch (err) {
        status.textContent = err.message; status.className = "status error";
        btn.disabled = false; btn.textContent = T[lang].btn_update;
      }
    });
  </script>
</body>
</html>
