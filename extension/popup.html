<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Unfair Advantage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0a0a0a; color: #f0f0f0; width: 380px; min-height: 200px; }

    .pill {
      padding: 5px 13px; border-radius: 9999px; font-size: 12px; font-weight: 500;
      border: 1px solid rgba(255,255,255,0.12); cursor: pointer; color: #777; transition: all 0.12s;
    }
    .pill:hover { color: #ccc; border-color: rgba(217,70,239,0.35); }
    .pill.active { background: #d946ef; border-color: #d946ef; color: #fff; }

    .btn {
      background: #d946ef; color: #fff; font-weight: 600; padding: 9px 0;
      border-radius: 9px; border: none; cursor: pointer; font-size: 13px;
      transition: background 0.12s; width: 100%;
    }
    .btn:hover { background: #c026d3; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .msg-box {
      background: #111; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 9px; padding: 10px 12px; font-size: 13px;
      line-height: 1.55; color: #e0e0e0; white-space: pre-wrap;
    }

    .copy-btn {
      padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
      background: rgba(217,70,239,0.12); color: #d946ef; border: 1px solid rgba(217,70,239,0.2);
      cursor: pointer; transition: all 0.12s; white-space: nowrap;
    }
    .copy-btn:hover { background: rgba(217,70,239,0.22); }
    .copy-btn.copied { background: rgba(34,197,94,0.12); color: #22c55e; border-color: rgba(34,197,94,0.2); }

    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(217,70,239,0.25);
      border-top-color: #d946ef; border-radius: 50%; animation: spin 0.65s linear infinite;
      display: inline-block; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1.5px solid rgba(217,70,239,0.35); }
    .avatar-ph { width: 36px; height: 36px; border-radius: 50%; background: #1c1c1c; display: flex; align-items: center; justify-content: center; font-size: 14px; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    #resultsSection { max-height: 400px; overflow-y: auto; }
    .section-label { font-size: 10px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.08em; }
  </style>
</head>
<body class="p-4">

  <!-- Header -->
  <div class="flex items-center justify-between mb-3">
    <span class="font-bold text-base">Unfair <span class="text-fuchsia-500">Advantage</span></span>
    <button onclick="openOptions()" class="text-gray-600 hover:text-gray-400 text-xs cursor-pointer border-none bg-transparent">⚙</button>
  </div>

  <!-- Not on profile -->
  <div id="notOnProfile" class="hidden text-center py-8">
    <div class="text-2xl mb-2">📍</div>
    <p class="text-sm text-gray-500">Naviga su un profilo Instagram<br />per usare l'estensione</p>
    <button class="mt-3 text-xs text-fuchsia-500 underline cursor-pointer border-none bg-transparent"
            onclick="chrome.tabs.create({url:'https://www.instagram.com'})">
      Apri Instagram
    </button>
  </div>

  <!-- Not logged in -->
  <div id="notLoggedIn" class="hidden text-center py-8">
    <div class="text-2xl mb-2">🔐</div>
    <p class="text-sm text-gray-500">Fai il login su Instagram nel browser<br />poi riapri l'estensione</p>
    <button class="mt-3 text-xs text-fuchsia-500 underline cursor-pointer border-none bg-transparent"
            onclick="chrome.tabs.create({url:'https://www.instagram.com/accounts/login/'})">
      Vai al login
    </button>
  </div>

  <!-- Main UI -->
  <div id="mainUi" class="hidden">

    <!-- Profile preview -->
    <div id="profilePreview" class="flex items-center gap-2.5 mb-4 p-2.5 rounded-lg bg-white/[0.03]">
      <div id="profileAvatar" class="avatar-ph">👤</div>
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-sm truncate" id="profileName"></div>
        <div class="text-xs text-gray-500" id="profileMeta"></div>
      </div>
    </div>

    <!-- Tone selector -->
    <div class="mb-3">
      <p class="section-label mb-2">Tono</p>
      <div class="flex flex-wrap gap-1.5">
        <button class="pill" data-tone="diretto" onclick="selectTone(this)">Diretto</button>
        <button class="pill active" data-tone="curioso" onclick="selectTone(this)">Curioso</button>
        <button class="pill" data-tone="giocoso" onclick="selectTone(this)">Giocoso</button>
        <button class="pill" data-tone="romantico" onclick="selectTone(this)">Romantico</button>
      </div>
    </div>

    <!-- Analyze button -->
    <button class="btn mb-4" id="analyzeBtn" onclick="analyze()">Analizza profilo</button>

    <!-- Loading -->
    <div id="loadingSection" class="hidden text-center py-4">
      <div class="spinner mb-2"></div>
      <p class="text-xs text-gray-500" id="loadingText">Caricamento profilo...</p>
    </div>

    <!-- Results -->
    <div id="resultsSection" class="hidden space-y-4">

      <!-- Profile summary -->
      <div id="summaryBlock" class="hidden">
        <p class="section-label mb-1.5">Profilo</p>
        <p class="text-xs text-gray-400 leading-relaxed" id="summaryText"></p>
      </div>

      <!-- Hooks -->
      <div id="hooksBlock" class="hidden">
        <p class="section-label mb-1.5">Hook trovati</p>
        <ul id="hooksList" class="space-y-0.5"></ul>
      </div>

      <!-- Messages -->
      <div id="messagesBlock">
        <p class="section-label mb-2">Messaggi</p>
        <div id="messagesList" class="space-y-2.5"></div>
      </div>

      <!-- Re-analyze -->
      <button onclick="resetAndAnalyze()"
        class="w-full text-xs text-gray-600 hover:text-gray-400 cursor-pointer border-none bg-transparent py-1">
        ↻ Rigenera messaggi
      </button>
    </div>

    <!-- Error -->
    <div id="errorSection" class="hidden">
      <p class="text-xs text-red-400 leading-relaxed" id="errorText"></p>
      <button onclick="retryFromError()"
        class="mt-2 text-xs text-fuchsia-500 underline cursor-pointer border-none bg-transparent">
        Riprova
      </button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
